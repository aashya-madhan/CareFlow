<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign In — CareFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="login-body">
<div class="login-overlay">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo"><i class="fa-solid fa-hospital"></i></div>
      <h1>CareFlow</h1>
      <p>Hospital Appointment Analytics</p>
    </div>

    {% if error %}
    <div class="login-error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form method="post" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" name="email" placeholder="admin@hospital.com"
                 required autocomplete="email"
                 value="{{ request.form.get('email','') }}"/>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" id="loginPw"
                 placeholder="••••••••" required autocomplete="current-password"/>
          <button type="button" class="eye-btn" onclick="togglePw()">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <div class="login-remember">
        <label><input type="checkbox" name="remember"/> Remember me</label>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
    </form>
    <div class="login-hint">Default: admin@hospital.com / Admin@123</div>
    <div class="auth-switch">
      Don't have an account?
      <a href="{{ url_for('auth.signup') }}">Create one →</a>
    </div>
    <div class="auth-back">
      <a href="{{ url_for('home.index') }}">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>
</div>
<script>
function togglePw(){
  const i=document.getElementById('loginPw');
  const e=document.getElementById('eyeIcon');
  if(i.type==='password'){i.type='text';e.className='fa-solid fa-eye-slash';}
  else{i.type='password';e.className='fa-solid fa-eye';}
}
</script>
</body>
</html>
